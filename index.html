<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBSERVER // TERMINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OBSERVER">
<link rel="preload" href="/fonts/minecraft.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('/fonts/minecraft.ttf') format('truetype');
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: #00ff40; color: #000; }

  html { height: 100%; }

  body {
    background-color: #050505;
    color: #c0c0c0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .header {
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
    padding: 10px 20px;
    padding-top: calc(10px + env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #888;
    font-size: 14px;
    letter-spacing: 1px;
    flex-shrink: 0;
    gap: 10px;
  }

  .header .title {
    color: #00ff40;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header .status { font-size: 12px; color: #555; white-space: nowrap; }

  .chat-container {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .chat-container::-webkit-scrollbar { width: 8px; }
  .chat-container::-webkit-scrollbar-thumb { background: #1a1a1a; }

  .msg {
    max-width: 85%;
    line-height: 1.6;
    font-size: 15px;
    animation: fade-in 0.3s ease-out;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    color: #4a9ec9;
    text-align: right;
  }

  .msg.observer {
    align-self: flex-start;
    color: #00ff40;
  }

  .msg.observer::before {
    content: '[OBSERVER] ';
    color: #00ff40;
    font-weight: bold;
  }

  .msg.system {
    align-self: center;
    color: #555;
    font-size: 12px;
    text-align: center;
    font-style: italic;
  }

  .msg.error {
    align-self: center;
    color: #ff4040;
    font-size: 12px;
    text-align: center;
    border: 1px solid #800000;
    padding: 10px;
    background: #1a0000;
    white-space: pre-wrap;
  }

  .input-area {
    background: #0a0a0a;
    border-top: 1px solid #1a1a1a;
    padding: 15px 20px;
    padding-bottom: calc(15px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    flex-shrink: 0;
  }

  .input-area .prompt {
    color: #00ff40;
    font-weight: bold;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    min-width: 0;
    background: #000;
    border: 1px solid #333;
    color: #c0c0c0;
    padding: 10px 15px;
    font-family: 'Courier New', monospace;
    font-size: 16px; /* предотвращает autozoom в iOS */
    outline: none;
    transition: border-color 0.2s;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }

  .input-area input:focus { border-color: #00ff40; }

  .input-area button {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #d8d8d8;
    padding: 10px 20px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }

  .input-area button:hover { background: #2a2a2a; border-color: #555; }
  .input-area button:active { background: #2a2a2a; }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

  .typing {
    display: inline-block;
    width: 8px;
    height: 15px;
    background-color: #00ff40;
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
    margin-left: 5px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    .header {
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top));
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .header .status { display: none; }
    .chat-container {
      padding: 12px;
      gap: 10px;
    }
    .msg { max-width: 92%; }
    .input-area {
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    .input-area .prompt { display: none; }
    .input-area button { padding: 10px 16px; }
  }

  @media (max-width: 380px) {
    .header .title { font-size: 11px; }
  }

  /* Landscape-телефон */
  @media (max-height: 500px) and (orientation: landscape) {
    .header {
      padding: 6px 12px;
      padding-top: calc(6px + env(safe-area-inset-top));
      font-size: 12px;
    }
    .chat-container {
      padding: 8px 12px;
      gap: 6px;
    }
    .input-area {
      padding: 6px 12px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">OBSERVER.SYS — MEMORY INTERFACE</div>
  <div class="status">retention: UNBOUNDED</div>
</div>

<div class="chat-container" id="chat">
  <div class="msg system">connection established. he is listening.</div>
</div>

<div class="input-area">
  <div class="prompt">C:\&gt;</div>
  <input
    type="text"
    id="user-input"
    placeholder="type a message..."
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    enterkeyhint="send"
  >
  <button id="send-btn" type="button">SEND</button>
</div>

<script>
  const PROXY_URL = "https://observer.matveja939.workers.dev/";

  const chatContainer = document.getElementById('chat');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  let chatHistory = [];

  // ===== Мобильная адаптация высоты под виртуальную клавиатуру =====
  if (isTouch && window.visualViewport) {
    const vv = window.visualViewport;
    const applyHeight = () => {
      // Игнорируем pinch-zoom — иначе layout будет скакать при зуме.
      if (vv.scale > 1.01) {
        document.body.style.height = '';
        return;
      }
      document.body.style.height = vv.height + 'px';
    };
    applyHeight();
    vv.addEventListener('resize', () => {
      applyHeight();
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });
  }

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (text) div.textContent = text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = '';
    sendBtn.disabled = true;
    userInput.disabled = true;

    appendMessage('user', text);

    const observerMsgEl = appendMessage('observer', '');
    observerMsgEl.innerHTML = '<span class="typing"></span>';

    chatHistory.push({ role: "user", content: text });

    try {
      const response = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory })
      });

      const data = await response.json();

      if (data.error) {
        observerMsgEl.textContent = `[API ERROR: ${data.error.message || data.error}]`;
        observerMsgEl.className = 'msg error';
        return;
      }

      if (data.choices && data.choices[0] && data.choices[0].message) {
        let reply = data.choices[0].message.content.replace(/^["']|["']$/g, '');
        observerMsgEl.textContent = reply;

        chatHistory.push({ role: "assistant", content: reply });

        if (chatHistory.length > 10) {
          chatHistory = chatHistory.slice(chatHistory.length - 10);
        }
      } else {
        observerMsgEl.textContent = "[observer is silent]";
        observerMsgEl.className = 'msg error';
      }
    } catch (error) {
      observerMsgEl.textContent = "[connection lost]";
      observerMsgEl.className = 'msg error';
    } finally {
      sendBtn.disabled = false;
      userInput.disabled = false;
      // На тач-устройствах клавиатура обычно уже открыта — не дёргаем фокус.
      if (!isTouch) userInput.focus();
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener('load', () => {
    if (!isTouch) userInput.focus();
  });
</script>

</body>
</html>
