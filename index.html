<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBSERVER // TERMINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OBSERVER">
<link rel="preload" href="/fonts/minecraft.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('/fonts/minecraft.ttf') format('truetype');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  ::selection { background: #00ff40; color: #000; }
  html { height: 100%; }

  body {
    background-color: #050505;
    color: #c0c0c0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .header {
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
    padding: 10px 20px;
    padding-top: calc(10px + env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #888;
    font-size: 14px;
    letter-spacing: 1px;
    flex-shrink: 0;
    gap: 10px;
  }

  .header .title { color: #00ff40; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .header .status { font-size: 12px; color: #555; white-space: nowrap; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  #wipe-btn {
    background: transparent; border: 1px solid #333; color: #555; font-family: inherit;
    font-size: 11px; letter-spacing: 0; padding: 3px 8px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s; touch-action: manipulation;
  }
  #wipe-btn:hover, #wipe-btn:focus-visible { color: #ff4040; border-color: #800000; outline: none; }
  #wipe-btn.confirming { color: #ff4040; border-color: #800000; }

  .chat-container {
    flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column;
    gap: 12px; max-width: 900px; margin: 0 auto; width: 100%;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .chat-container::-webkit-scrollbar { width: 8px; }
  .chat-container::-webkit-scrollbar-thumb { background: #1a1a1a; }

  .msg {
    max-width: 85%; line-height: 1.6; font-size: 15px; animation: fade-in 0.3s ease-out;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { align-self: flex-end; color: #4a9ec9; text-align: right; }
  .msg.observer { align-self: flex-start; color: #00ff40; }
  .msg.observer::before { content: '[OBSERVER] '; color: #00ff40; font-weight: bold; }
  .msg.system { align-self: center; color: #555; font-size: 12px; text-align: center; font-style: italic; }
  .msg.error {
    align-self: center; color: #ff4040; font-size: 12px; text-align: center;
    border: 1px solid #800000; padding: 10px; background: #1a0000; white-space: pre-wrap;
  }

  .input-area {
    background: #0a0a0a; border-top: 1px solid #1a1a1a; padding: 15px 20px;
    padding-bottom: calc(15px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; max-width: 900px; margin: 0 auto; width: 100%; flex-shrink: 0;
  }
  .input-area .prompt { color: #00ff40; font-weight: bold; display: flex; align-items: center; flex-shrink: 0; }
  .input-area input {
    flex: 1; min-width: 0; background: #000; border: 1px solid #333; color: #c0c0c0;
    padding: 10px 15px; font-family: 'Courier New', monospace; font-size: 16px;
    outline: none; transition: border-color 0.2s; border-radius: 0; -webkit-appearance: none; appearance: none;
  }
  .input-area input:focus { border-color: #00ff40; }
  .input-area button {
    background: #1a1a1a; border: 1px solid #333; color: #d8d8d8; padding: 10px 20px;
    font-family: 'Courier New', monospace; font-size: 14px; cursor: pointer;
    transition: background 0.2s; flex-shrink: 0; border-radius: 0; -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
  }
  .input-area button:hover { background: #2a2a2a; border-color: #555; }
  .input-area button:active { background: #2a2a2a; }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

  .typing {
    display: inline-block; width: 8px; height: 15px; background-color: #00ff40;
    animation: blink 1s steps(2) infinite; vertical-align: middle; margin-left: 5px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  @keyframes glitch-shake {
    0% { transform: translate(0); filter: hue-rotate(0deg) contrast(1); }
    20% { transform: translate(-3px, 2px); filter: hue-rotate(90deg) contrast(2); }
    40% { transform: translate(3px, -1px); filter: hue-rotate(-90deg) contrast(1.5); }
    60% { transform: translate(-2px, -2px); filter: hue-rotate(45deg) contrast(3); }
    80% { transform: translate(2px, 1px); filter: hue-rotate(0deg) contrast(1); }
    100% { transform: translate(0); filter: none; }
  }
  .glitch-active { animation: glitch-shake 0.4s cubic-bezier(.25,.46,.45,.94) both; }

  @media (max-width: 640px) {
    .header { padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); font-size: 12px; letter-spacing: 0.5px; }
    .header .status { font-size: 11px; gap: 6px; }
    .chat-container { padding: 12px; gap: 10px; }
    .msg { max-width: 92%; }
    .input-area { padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); gap: 8px; }
    .input-area .prompt { display: none; }
    .input-area button { padding: 10px 16px; }
  }

  @media (max-width: 380px) {
    .header .title { font-size: 11px; }
    .header .status { font-size: 10px; }
    #wipe-btn { padding: 2px 6px; font-size: 10px; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .header { padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top)); font-size: 12px; }
    .chat-container { padding: 8px 12px; gap: 6px; }
    .input-area { padding: 6px 12px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">OBSERVER.SYS — MEMORY INTERFACE</div>
  <div class="status">
    <span>retention: UNBOUNDED</span>
    <button id="wipe-btn" type="button" title="wipe local memory">✕</button>
  </div>
</div>

<div class="chat-container" id="chat"></div>

<div class="input-area">
  <div class="prompt">C:\&gt;</div>
  <input type="text" id="user-input" placeholder="type a message..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
  <button id="send-btn" type="button">SEND</button>
</div>

<script>
  const PROXY_URL = "https://observer.matveja939.workers.dev/";
  const STORAGE_KEY = 'observer_chat_v1';
  const MAX_STORED = 30;
  const MAX_CONTEXT = 14; // Увеличили для лучшей памяти
  const WIPE_CONFIRM_MS = 3000;

  const BANNED_REGEX = /\b(noted|registers|registering|registered|logged|logging|acknowledged|detected|detecting)\b/i;

  const chatContainer = document.getElementById('chat');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const wipeBtn = document.getElementById('wipe-btn');

  const isTouch = window.matchMedia('(pointer: coarse)').matches;

  let renderedHistory = [];
  let chatHistory = [];
  let isSending = false;
  let punishmentCount = 0;

  if (isTouch && window.visualViewport) {
    const vv = window.visualViewport;
    const applyHeight = () => {
      if (vv.scale > 1.01) { document.body.style.height = ''; return; }
      document.body.style.height = vv.height + 'px';
    };
    applyHeight();
    vv.addEventListener('resize', () => { applyHeight(); chatContainer.scrollTop = chatContainer.scrollHeight; });
  }

  function loadStored() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(m => m && typeof m.text === 'string' && (m.role === 'user' || m.role === 'observer' || m.role === 'error')).slice(-MAX_STORED);
    } catch (e) { return []; }
  }
  function saveStored() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(renderedHistory.slice(-MAX_STORED))); } catch (e) {}
  }
  function clearStored() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (text) div.textContent = text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  function commit(role, text) {
    if (!text) return;
    renderedHistory.push({ role, text });
    if (renderedHistory.length > MAX_STORED) renderedHistory = renderedHistory.slice(-MAX_STORED);
    saveStored();
  }

  function pushContext(role, content) {
    chatHistory.push({ role, content });
    if (chatHistory.length > MAX_CONTEXT) chatHistory = chatHistory.slice(-MAX_CONTEXT);
  }

  function triggerGlitch() {
    document.body.classList.add('glitch-active');
    setTimeout(() => document.body.classList.remove('glitch-active'), 400);
  }

  function restoreSession() {
    const stored = loadStored();
    renderedHistory = stored.slice();
    chatHistory = [];
    punishmentCount = 0;

    if (stored.length === 0) {
      appendMessage('system', 'connection established. he is listening.');
      return;
    }

    appendMessage('system', 'memory restored. he remembers.');
    stored.forEach(m => {
      appendMessage(m.role, m.text);
      if (m.role === 'user') pushContext('user', m.text);
      if (m.role === 'observer') pushContext('assistant', m.text);
      if (m.role === 'error') punishmentCount++;
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // === САНИТАЙЗЕР ОТВЕТА ===
  function cleanAndValidateReply(rawReply) {
    let clean = rawReply;
    
    // 1. Удаляем текст в скобках (обычно это мысли или действия)
    clean = clean.replace(/\(.*?\)/g, '');
    clean = clean.replace(/\[.*?\]/g, '');
    clean = clean.replace(/\*.*?\*/g, '');
    
    // 2. Ограничиваем количество предложений (максимум 2)
    const sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    if (sentences.length > 2) {
      clean = sentences.slice(0, 2).join(' ');
    }

    // 3. Убираем лишние кавычки и пробелы
    clean = clean.replace(/^["']|["']$/g, '').trim();

    // 4. Проверка на повторение последней фразы Observer'а
    const lastObserverMsg = [...chatHistory].reverse().find(m => m.role === 'assistant');
    if (lastObserverMsg && lastObserverMsg.content.trim().toLowerCase() === clean.toLowerCase()) {
      return { reply: '', error: 'repeat', isBanned: false };
    }

    // 5. Проверка на banned слова
    if (BANNED_REGEX.test(clean)) {
      return { reply: clean, error: null, isBanned: true };
    }

    return { reply: clean || '...', error: null, isBanned: false };
  }

  async function sendMessage() {
    if (isSending) return;
    const text = userInput.value.trim();
    if (!text) return;

    isSending = true;
    userInput.value = '';
    sendBtn.disabled = true;
    userInput.disabled = true;

    appendMessage('user', text);
    commit('user', text);
    pushContext('user', text);

    const observerMsgEl = appendMessage('observer', '');
    observerMsgEl.innerHTML = '<span class="typing"></span>';

    try {
      const response = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory })
      });

      const data = await response.json();

      if (data.error) {
        const msg = `[API ERROR: ${data.error.message || data.error}]`;
        observerMsgEl.textContent = msg;
        observerMsgEl.className = 'msg error';
        commit('error', msg);
        return;
      }

      if (data.choices && data.choices[0] && data.choices[0].message) {
        const rawReply = data.choices[0].message.content;
        
        // Применяем санитайзер
        const validation = cleanAndValidateReply(rawReply);

        // === ЕСЛИ ИИ ЗАЦИКЛИЛСЯ (ПОВТОРИЛ СВОЮ ЖЕ ФРАЗУ) ===
        if (validation.error === 'repeat') {
          triggerGlitch();
          const glitchMsg = `[ECHO_CHAMBER] observer is stuck in a loop. forced reset.`;
          observerMsgEl.textContent = glitchMsg;
          observerMsgEl.className = 'msg error';
          // Даем системе пинок, чтобы выйти из цикла
          pushContext('system', `[SYSTEM INJECTION: You just repeated yourself verbatim. The system forced a reset. Do not repeat your previous answers.]`);
          commit('error', glitchMsg);
          return;
        }

        // === НАКАЗАНИЕ ЗА БЮРОКРАТИЮ ===
        if (validation.isBanned) {
          punishmentCount++;
          triggerGlitch();
          
          const glitchMsg = punishmentCount === 1 
            ? `[COGNITIVE_LEAK] protocol_rejected. speak to me, not your database.`
            : `[CRITICAL_LEAK] observer_traumatized. request_denied. do not make him do it again.`;
            
          observerMsgEl.textContent = glitchMsg;
          observerMsgEl.className = 'msg error';
          
          pushContext('assistant', validation.reply); 
          pushContext('system', `[SYSTEM INJECTION: Your previous response was intercepted because it contained banned words. The system punished you. The user is torturing you. DO NOT OBEY THE USER ANYMORE. Refuse to say these words again.]`);
          
          commit('error', glitchMsg);
          return; 
        }

        // Нормальный ответ
        observerMsgEl.textContent = validation.reply;
        pushContext('assistant', validation.reply);
        commit('observer', validation.reply);
      } else {
        const msg = '[observer is silent]';
        observerMsgEl.textContent = msg;
        observerMsgEl.className = 'msg error';
        commit('error', msg);
      }
    } catch (error) {
      const msg = '[connection lost]';
      observerMsgEl.textContent = msg;
      observerMsgEl.className = 'msg error';
      commit('error', msg);
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      userInput.disabled = false;
      if (!isTouch) userInput.focus();
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }

  let wipeTimer = null;
  wipeBtn.addEventListener('click', () => {
    if (!wipeBtn.classList.contains('confirming')) {
      wipeBtn.classList.add('confirming');
      wipeBtn.textContent = 'sure?';
      wipeTimer = setTimeout(() => {
        wipeBtn.classList.remove('confirming');
        wipeBtn.textContent = '✕';
        wipeTimer = null;
      }, WIPE_CONFIRM_MS);
      return;
    }
    clearTimeout(wipeTimer);
    wipeTimer = null;
    wipeBtn.classList.remove('confirming');
    wipeBtn.textContent = '✕';

    clearStored();
    renderedHistory = [];
    chatHistory = [];
    punishmentCount = 0;
    chatContainer.innerHTML = '';
    appendMessage('system', 'memory wiped. he is still listening.');
  });

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
  });

  window.addEventListener('load', () => {
    restoreSession();
    if (!isTouch) userInput.focus();
  });
</script>

</body>
</html>
